name: Broken Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Test, Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Thiết lập Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # LỖI 1: thiếu bước chmod +x gradlew

      - name: Chạy JUnit Test
        run: ./gradlew test

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTY_TOKEN }}   # LỖI 2: sai chính tả tên secret

      - name: Build và push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker                         # LỖI 3: sai thư mục
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/it209_ss12_ex5:latest
