name: Broken Pipeline (fixed)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Test, Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Thiết lập Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper   # SỬA LỖI 1
        run: chmod +x gradlew

      - name: Chạy JUnit Test
        run: ./gradlew test

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}  # SỬA LỖI 2

      - name: Build và push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                # SỬA LỖI 3
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/it209_ss12_ex5:latest
